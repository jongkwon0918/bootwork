# log 설정하기
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){lime} \
%clr(${PID:-}){blue} %boldRed([%thread]) %highlight([%-5level]) \
%clr(%-40.40logger{39}){cyan} %magenta(%msg%n)

# 로그레벨 설정하기
#logging.level.com.bs.boot=warn
#logging.level.org.springframework.core=debug


#fileappender 적용하기
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.file-name-pattern=C:\\Users\\knuser\\logs\\mylog%d{yyyy.MM.dd_HHmmss}%i.log

logging.file.name=mylog.log